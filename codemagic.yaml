workflows:
  mylifelens-android:
    name: MyLifelens Android
    working_directory: artifacts/diditallifea
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - mylifelens_keystore
      node: v22.13.1
      java: 17
      vars:
        PACKAGE_NAME: com.mylifelens.app
    scripts:
      - name: Install workspace dependencies
        script: |
          cd "$CM_BUILD_DIR"
          npx --yes pnpm@10.26.1 install --frozen-lockfile
      - name: Generate Android project
        script: |
          npx --yes pnpm@10.26.1 exec expo prebuild --platform android --no-install
      - name: Configure Android release signing
        script: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()
          old_signing = "    signingConfigs {\n        debug {\n            storeFile file('debug.keystore')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }"
          new_signing = "    signingConfigs {\n        debug {\n            storeFile file('debug.keystore')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n        release {\n            storeFile file(System.getenv('CM_KEYSTORE_PATH'))\n            storePassword System.getenv('CM_KEYSTORE_PASSWORD')\n            keyAlias System.getenv('CM_KEY_ALIAS')\n            keyPassword System.getenv('CM_KEY_PASSWORD')\n        }\n    }"
          if old_signing not in text:
              raise SystemExit("Could not find the generated Android signing configuration")
          text = text.replace(old_signing, new_signing, 1)
          old_release = "            signingConfig signingConfigs.debug\n            def enableShrinkResources"
          new_release = "            signingConfig signingConfigs.release\n            def enableShrinkResources"
          if old_release not in text:
              raise SystemExit("Could not find the generated Android release build type")
          text = text.replace(old_release, new_release, 1)
          path.write_text(text)
          PY
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/artifacts/diditallifea/android/local.properties"
      - name: Build Android App Bundle
        script: |
          cd android
          ./gradlew bundleRelease \
            -PversionCode="${BUILD_NUMBER:-1}" \
            -PversionName="1.0.${BUILD_NUMBER:-1}"
    artifacts:
      - android/app/build/outputs/**/*.aab
