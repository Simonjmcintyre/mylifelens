workflows:
  mylifelens-android:
    name: MyLifelens Android
    working_directory: artifacts/diditallifea
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - mylifelens_keystore
      node: v22.13.1
      java: 17
      vars:
        PACKAGE_NAME: com.mylifelens.app
    scripts:
      - name: Install workspace dependencies
        script: |
          cd "$CM_BUILD_DIR"
          npx --yes pnpm@10.26.1 install --frozen-lockfile
      - name: Configure RevenueCat Android public key
        script: |
          python3 - <<'PY'
          import os
          import re
          import shlex
          from pathlib import Path

          workspace = Path(os.environ["CM_BUILD_DIR"])
          api_key = os.environ.get("EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY", "").strip()

          if not api_key:
              replit_config = workspace / ".replit"
              config_text = replit_config.read_text()
              match = re.search(
                  r'^EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY\s*=\s*"([^"]+)"\s*$',
                  config_text,
                  re.MULTILINE,
              )
              if match:
                  api_key = match.group(1).strip()

          if not api_key:
              raise SystemExit(
                  "EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY is not configured"
              )

          env_file = workspace / ".codemagic-revenuecat.env"
          env_file.write_text(
              "export EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY="
              + shlex.quote(api_key)
              + "\n"
          )
          env_file.chmod(0o600)
          print("RevenueCat Android public key configured")
          PY
      - name: Generate Android project
        script: |
          source "$CM_BUILD_DIR/.codemagic-revenuecat.env"
          VERSION_CODE=$(python3 -c 'import os; print(max(2, int(os.getenv("BUILD_NUMBER", "2"))))')
          python3 -c 'import json, sys; path = "app.json"; data = json.load(open(path)); version_code = int(sys.argv[1]); data["expo"]["android"]["versionCode"] = version_code; data["expo"]["version"] = f"1.0.{version_code}"; open(path, "w").write(json.dumps(data, indent=2) + "\n")' "$VERSION_CODE"
          echo "Generating Android build with version code $VERSION_CODE"
          npx --yes pnpm@10.26.1 exec expo prebuild --platform android --no-install
      - name: Configure Android release signing
        script: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()
          old_signing = "    signingConfigs {\n        debug {\n            storeFile file('debug.keystore')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }"
          new_signing = "    signingConfigs {\n        debug {\n            storeFile file('debug.keystore')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n        release {\n            storeFile file(System.getenv('CM_KEYSTORE_PATH'))\n            storePassword System.getenv('CM_KEYSTORE_PASSWORD')\n            keyAlias System.getenv('CM_KEY_ALIAS')\n            keyPassword System.getenv('CM_KEY_PASSWORD')\n        }\n    }"
          if old_signing not in text:
              raise SystemExit("Could not find the generated Android signing configuration")
          text = text.replace(old_signing, new_signing, 1)
          old_release = "            signingConfig signingConfigs.debug\n            def enableShrinkResources"
          new_release = "            signingConfig signingConfigs.release\n            def enableShrinkResources"
          if old_release not in text:
              raise SystemExit("Could not find the generated Android release build type")
          text = text.replace(old_release, new_release, 1)
          path.write_text(text)
          PY
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/artifacts/diditallifea/android/local.properties"
      - name: Build Android App Bundle
        script: |
          source "$CM_BUILD_DIR/.codemagic-revenuecat.env"
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
  mylifelens-ios:
    name: MyLifelens iOS
    working_directory: artifacts/diditallifea
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: MyLifelens Apple
    environment:
      ios_signing:
        certificates:
          - mylifelens_distribution
        provisioning_profiles:
          - mylifelens_app_store_profile
      node: v22.13.1
      xcode: latest
      vars:
        BUNDLE_ID: com.mylifelens.app
    scripts:
      - name: Install workspace dependencies
        script: |
          cd "$CM_BUILD_DIR"
          npx --yes pnpm@10.26.1 install --frozen-lockfile
      - name: Configure RevenueCat iOS public key
        script: |
          python3 - <<'PY'
          import os
          import re
          import shlex
          from pathlib import Path

          workspace = Path(os.environ["CM_BUILD_DIR"])
          api_key = os.environ.get("EXPO_PUBLIC_REVENUECAT_IOS_API_KEY", "").strip()

          if not api_key:
              replit_config = workspace / ".replit"
              config_text = replit_config.read_text()
              match = re.search(
                  r'^EXPO_PUBLIC_REVENUECAT_IOS_API_KEY\s*=\s*"([^"]+)"\s*$',
                  config_text,
                  re.MULTILINE,
              )
              if match:
                  api_key = match.group(1).strip()

          if not api_key:
              raise SystemExit(
                  "EXPO_PUBLIC_REVENUECAT_IOS_API_KEY is not configured"
              )

          env_file = workspace / ".codemagic-revenuecat-ios.env"
          env_file.write_text(
              "export EXPO_PUBLIC_REVENUECAT_IOS_API_KEY="
              + shlex.quote(api_key)
              + "\n"
          )
          env_file.chmod(0o600)
          print("RevenueCat iOS public key configured")
          PY
      - name: Generate iOS project
        script: |
          source "$CM_BUILD_DIR/.codemagic-revenuecat-ios.env"
          BUILD_VERSION=$(python3 -c 'import os; print(max(1, int(os.getenv("BUILD_NUMBER", "1"))))')
          python3 -c 'import json, sys; path = "app.json"; data = json.load(open(path)); build_version = str(sys.argv[1]); data["expo"]["ios"]["buildNumber"] = build_version; data["expo"]["version"] = f"1.0.{build_version}"; open(path, "w").write(json.dumps(data, indent=2) + "\n")' "$BUILD_VERSION"
          echo "Generating iOS build $BUILD_VERSION"
          npx --yes pnpm@10.26.1 exec expo prebuild --platform ios --no-install
          cd ios
          pod install
          cd ..
      - name: Install iOS signing certificate
        script: |
          keychain initialize
          keychain add-certificates
      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          source "$CM_BUILD_DIR/.codemagic-revenuecat-ios.env"
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          if [ -z "$WORKSPACE" ]; then
            echo "No generated Xcode workspace found"
            exit 1
          fi
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building workspace $WORKSPACE with scheme $SCHEME"
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
